<style>
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--txt:#fff;--dim:#8e8e93;
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;
}
:root[data-t="claro"]{
  --bg:#f2f2f7;--card:#fff;--card2:#ececef;--line:#d8d8dc;--txt:#000;--dim:#6c6c70;
  --blue:#007aff;--green:#1e9e4a;--red:#d70015;--orange:#c76a00;--purple:#8a2be2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
html,body{margin:0;background:var(--bg);color:var(--txt);overscroll-behavior-y:contain}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  padding:22px 16px calc(30px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
button{font-family:inherit;color:inherit}
button:active{opacity:.55}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
#st{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-top:3px}
.ic{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--card);color:var(--blue);font-size:19px;line-height:1}
#rf.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border-radius:16px;padding:13px 14px;border:0;text-align:left;width:100%;display:block}
.c.on{box-shadow:inset 0 0 0 2px var(--blue)}
.c b{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c s{display:block;text-decoration:none;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.c i{font-style:normal;font-size:11px;font-weight:700}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
.ttl{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;margin:0 0 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl button{background:none;border:0;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.5px;padding:0}
.ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hname{color:var(--dim);max-width:45%;flex:none}
.base{background:var(--card2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.base select{background:none;border:0;color:var(--txt);font-size:15px;font-weight:700;padding:4px;max-width:44%;-webkit-appearance:none;outline:none}
.base input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font-size:28px;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none}
.r{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.r .fl{font-size:21px;width:25px;text-align:center;flex:none}
.r .id{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden}
.r .cd{font-size:14px;font-weight:700;flex:none}
.r .nm{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .vl{width:42%;background:none;border:0;color:var(--txt);font-size:19px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:right;outline:none;-webkit-appearance:none;padding:2px 0}
.r .vl:focus{color:var(--blue)}
.r .mv{border:0;background:none;color:var(--line);font-size:15px;padding:0 1px;flex:none}
.edit .mv{color:var(--blue)}
.add{display:flex;gap:8px;margin-top:12px}
.add{width:100%}
.add select,.sel{flex:1;min-width:0;width:100%;text-overflow:ellipsis;background:var(--card2);border:0;color:var(--txt);font-size:15px;padding:11px;border-radius:12px;-webkit-appearance:none;outline:none}
.chips{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card2);border:0;color:var(--dim);font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px}
.chip.on{background:var(--blue);color:#fff}
#chart{width:100%;height:190px;display:block;touch-action:none}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}
.hd .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.hd .sub{font-size:12px;color:var(--dim)}
.hd .dt{font-size:12px;color:var(--dim);text-align:right}
.up{color:var(--green)}.dn{color:var(--red)}
.cfg{display:none}
.cfg.open{display:block}
.cfgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cfgrow select{background:var(--card2);border:0;color:var(--txt);font-size:14px;padding:8px 10px;border-radius:10px;-webkit-appearance:none;outline:none;max-width:60%}
.banner{display:flex;gap:14px;align-items:center;background:var(--blue);color:#fff;border-radius:20px;padding:16px}
.banner div{font-size:13px;opacity:.92}
.banner strong{display:block;font-size:16px;opacity:1;margin-bottom:2px}
.mini{font-size:11px;color:var(--dim);margin-top:10px;text-align:center}
</style>
</head>
<body>
<header>
  <div><h1>Finanzas Pro CL</h1><div id="st">valores base</div></div>
  <button class="ic" id="cfgb" title="Ajustes">⚙</button>
  <button class="ic" id="rf" title="Actualizar">⟳</button>
</header>

<div class="panel cfg" id="cfg">
  <p class="ttl">Ajustes</p>
  <div class="cfgrow"><span>Tema</span>
    <select id="theme"><option value="oscuro">Oscuro</option><option value="claro">Claro</option><option value="auto">Automático</option></select></div>
  <div class="cfgrow"><span>Decimales</span>
    <select id="dec"><option value="auto">Automático</option><option value="0">0</option><option value="2">2</option><option value="4">4</option><option value="6">6</option></select></div>
  <div class="cfgrow"><span>Tarjetas superiores</span>
    <select id="ncards"><option value="2">2</option><option value="4">4</option><option value="6">6</option><option value="8">8</option></select></div>
  <div class="cfgrow"><span>Reordenar monedas</span>
    <select id="editm"><option value="0">Off</option><option value="1">On</option></select></div>
  <div class="cfgrow"><span>Restablecer todo</span><button class="chip" onclick="reset()">Borrar ajustes</button></div>
</div>

<div class="cards" id="cards"></div>

<div class="panel">
  <p class="ttl"><span>📈 Histórico</span><span id="hname"></span></p>
  <div class="chips" id="hsel"></div>
  <div class="hd">
    <div><div class="big" id="hval">—</div><div class="sub" id="hchg"></div></div>
    <div class="dt" id="hdate"></div>
  </div>
  <svg id="chart" viewBox="0 0 340 190" preserveAspectRatio="none"></svg>
  <div class="chips" style="margin:10px 0 0" id="hrange"></div>
</div>

<div class="panel">
  <p class="ttl"><span>⇄ Calculadora multidivisa</span><button onclick="swap()">Invertir</button></p>
  <div class="base">
    <select id="base"></select>
    <input id="amt" inputmode="decimal" enterkeyhint="done" placeholder="0">
  </div>
  <div id="list"></div>
  <div class="add"><select id="pick"><option value="">+ Agregar moneda…</option></select></div>
  <div class="mini">Escribe en cualquier fila: la conversión va en los dos sentidos.</div>
</div>

<div class="banner">
  <div style="font-size:26px">⊕</div>
  <div><strong>Acceso Directo</strong>Toca Compartir y luego "Agregar al inicio" para usarla como App.</div>
</div>

// Indicadores con historial. tipo: mind = mindicador.cl, cg = CoinGecko
const IND={
  dolar:{n:'Dólar observado',t:'mind',u:'$',col:'var(--green)'},
  uf:{n:'Unidad de Fomento',t:'mind',u:'$',col:'var(--green)'},
  euro:{n:'Euro',t:'mind',u:'$',col:'var(--blue)'},
  utm:{n:'UTM',t:'mind',u:'$',col:'var(--blue)'},
  ipc:{n:'IPC mensual',t:'mind',u:'%',col:'var(--orange)'},
  imacec:{n:'IMACEC',t:'mind',u:'%',col:'var(--orange)'},
  tpm:{n:'Tasa Política Monetaria',t:'mind',u:'%',col:'var(--purple)'},
  libra_cobre:{n:'Libra de cobre',t:'mind',u:'US$',col:'var(--orange)'},
  tasa_desempleo:{n:'Desempleo',t:'mind',u:'%',col:'var(--red)'},
  ivp:{n:'IVP',t:'mind',u:'$',col:'var(--dim)'},
  bitcoin:{n:'Bitcoin (CLP)',t:'cg',id:'bitcoin',u:'$',col:'var(--orange)'},
  ethereum:{n:'Ethereum (CLP)',t:'cg',id:'ethereum',u:'$',col:'var(--purple)'},
  solana:{n:'Solana (CLP)',t:'cg',id:'solana',u:'$',col:'var(--green)'}
};
const RANGES=[['1M',30],['3M',90],['6M',180],['1A',365],['Máx',3650]];

/* ---------- estado ---------- */
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let R=SNAP;
let sel=LS.get('sel',['USD','EUR','UF','UTM','BTC','ETH','ARS','BRL','PEN','GBP']);
let base=LS.get('base','CLP');
let cardsSel=LS.get('cards',['uf','dolar','bitcoin','ethereum']);
let cfg=Object.assign({theme:'oscuro',dec:'auto',ncards:4,edit:0},LS.get('cfg',{}));
let hInd=LS.get('hind','dolar'), hDays=LS.get('hdays',90), hData=null;
const hCache={};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const el=id=>document.getElementById(id);
const flag=c=>XFLAG[c]||String.fromCodePoint(...[...c.slice(0,2)].map(x=>0x1F1A5+x.charCodeAt(0)));
const name=c=>{if(LOCAL[c])return LOCAL[c];try{return NM.of(c)}catch(e){return c}};
const autoDec=v=>{v=Math.abs(v);return v>=1000?0:v>=1?2:v>=.01?4:8};
const DEC=v=>cfg.dec==='auto'?autoDec(v):+cfg.dec;
const fmt=(v,d)=>v.toLocaleString('es-CL',{minimumFractionDigits:Math.min(d,2),maximumFractionDigits:d});
const money=v=>v.toLocaleString('es-CL',{maximumFractionDigits:Math.abs(v)>=1000?0:2});
const num=e=>parseFloat((e.value||'').replace(/\./g,'').replace(',','.'));
const dayfmt=d=>d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});

/* ---------- tarjetas ---------- */
function cards(){
  el('cards').innerHTML=cardsSel.slice(0,cfg.ncards).map(k=>{
    const i=IND[k], v=indValue(k), ch=hCache[k+'_365']?pct(hCache[k+'_365'],k):null;
    return `<button class="c${k===hInd?' on':''}" onclick="setInd('${k}')">
      <b>${i.n}</b><s style="color:${i.col}">${i.u==='%'?'':i.u}${v==null?'—':money(v)}${i.u==='%'?'%':''}</s>
      ${ch!==null?`<i class="${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'} ${pc(ch)}${unit(k)} año</i>`:''}</button>`}).join('');
}
function indValue(k){
  if(k==='dolar')return R.USD; if(k==='uf')return R.UF; if(k==='utm')return R.UTM; if(k==='euro')return R.EUR;
  if(IND[k].t==='cg'){const c=Object.keys(CRYPTO).find(x=>CRYPTO[x]===IND[k].id);return c?R[c]:null}
  const s=hCache[k+'_365']; return s&&s.length?s[s.length-1][1]:null;
}
// Variación últimos 365 días. Si el indicador ya es un %, la variación son puntos porcentuales.
function pct(s,k){if(!s||s.length<2)return null;
  const w=s.filter(p=>p[0]>=Date.now()-365*864e5);
  const a=(w.length>1?w:s)[0][1], b=s[s.length-1][1];
  if(IND[k]&&IND[k].u==='%')return b-a;
  return a?(b/a-1)*100:null}
const unit=k=>IND[k]&&IND[k].u==='%'?' pp':'%';
const pc=v=>Math.abs(v).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:2});

/* ---------- calculadora (bidireccional) ---------- */
function rows(){
  el('list').innerHTML=sel.filter(c=>R[c]).map((c,i)=>
    `<div class="r${cfg.edit?' edit':''}"><span class="fl">${flag(c)}</span>
      <span class="id"><span class="cd">${c}</span><span class="nm">${name(c)}</span></span>
      <input class="vl" id="v${c}" inputmode="decimal" enterkeyhint="done" oninput="calc('${c}')" onfocus="this.select()">
      ${cfg.edit?`<button class="mv" onclick="mv('${c}',-1)">↑</button><button class="mv" onclick="mv('${c}',1)">↓</button>`:''}
      <button class="mv" onclick="rm('${c}')">×</button></div>`).join('');
  calc(base);
}
function rm(c){sel=sel.filter(x=>x!==c);LS.set('sel',sel);rows();fillPick()}
function mv(c,d){const i=sel.indexOf(c),j=i+d;if(j<0||j>=sel.length)return;
  [sel[i],sel[j]]=[sel[j],sel[i]];LS.set('sel',sel);rows()}
function swap(){ // la primera moneda de la lista pasa a ser la base
  const c=sel[0];if(!c)return;sel[0]=base;base=c;LS.set('sel',sel);LS.set('base',base);fillPick();rows()}
function calc(src){
  const from=src===base?el('amt'):el('v'+src);
  if(!from)return;
  const v=num(from);
  const put=(c,node)=>{if(!node||c===src)return;const x=v*R[src]/R[c];
    node.value=isFinite(x)?fmt(x,DEC(x)):''};
  put(base,el('amt'));
  sel.forEach(c=>put(c,el('v'+c)));
  LS.set('amt',el('amt').value);
}
function fillPick(){
  const all=Object.keys(R).sort((a,b)=>name(a).localeCompare(name(b),'es'));
  el('pick').innerHTML='<option value="">+ Agregar moneda…</option>'+
    all.filter(c=>!sel.includes(c)&&c!==base).map(c=>`<option value="${c}">${flag(c)}  ${c} — ${name(c)}</option>`).join('');
  el('base').innerHTML=all.map(c=>`<option value="${c}"${c===base?' selected':''}>${flag(c)} ${c}</option>`).join('');
}

/* ---------- histórico ---------- */
function hchips(){
  el('hsel').innerHTML=Object.keys(IND).map(k=>
    `<button class="chip${k===hInd?' on':''}" onclick="setInd('${k}')">${IND[k].n}</button>`).join('');
  el('hrange').innerHTML=RANGES.map(([t,d])=>
    `<button class="chip${d===hDays?' on':''}" onclick="setRange(${d})">${t}</button>`).join('');
  el('hname').textContent=IND[hInd].n;
}
function setInd(k){hInd=k;LS.set('hind',k);hchips();cards();hist()}
function setRange(d){hDays=d;LS.set('hdays',d);hchips();hist()}

// serie embebida en el archivo (siempre disponible, sin red)
const embedded=k=>HIST[k]?HIST[k].map(p=>[p[0]*864e5,p[1]]):null;

async function serie(k,days){
  const key=k+'_'+(days>365?3650:365);
  if(hCache[key])return hCache[key];
  const c=LS.get('h_'+key,null);
  if(c&&Date.now()-c.t<6*3600e3){hCache[key]=c.s;return c.s}
  const i=IND[k];let s=[];
  try{
    if(i.t==='mind'){
      const yr=new Date().getFullYear(), yrs=days>365?[yr-2,yr-1,yr]:[yr-1,yr];
      const res=await Promise.all(yrs.map(y=>fetch(`https://mindicador.cl/api/${k}/${y}`).then(r=>r.json()).catch(()=>null)));
      res.filter(Boolean).forEach(r=>(r.serie||[]).forEach(p=>s.push([+new Date(p.fecha),p.valor])));
    }else{
      const r=await fetch(`https://api.coingecko.com/api/v3/coins/${i.id}/market_chart?vs_currency=clp&days=${days>365?'max':365}&interval=daily`).then(r=>r.json());
      s=(r.prices||[]).map(p=>[p[0],p[1]]);
    }
  }catch(e){s=[]}
  if(!s.length)return hCache[key]=embedded(k)||[];   // sin red: gráfico con lo embebido
  s.sort((a,b)=>a[0]-b[0]);
  hCache[key]=s;LS.set('h_'+key,{t:Date.now(),s});
  return s;
}

async function hist(){
  draw(null);
  try{
    const all=await serie(hInd,hDays);
    const cut=Date.now()-hDays*864e5;
    hData=all.filter(p=>p[0]>=cut);
    if(hData.length<2)hData=all.slice(-2);
    draw(hData);cards();
  }catch(e){el('hval').textContent='sin datos';}
}

function draw(s,hoverIdx){
  const svg=el('chart'),W=340,H=190,P=6;
  if(!s||s.length<2){svg.innerHTML='';el('hval').textContent='cargando…';el('hchg').textContent='';el('hdate').textContent='';return}
  const ys=s.map(p=>p[1]),min=Math.min(...ys),max=Math.max(...ys),rg=(max-min)||1;
  const X=i=>P+i*(W-2*P)/(s.length-1), Y=v=>P+(1-(v-min)/rg)*(H-2*P);
  const line=s.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const up=ys[ys.length-1]>=ys[0], col=up?'var(--green)':'var(--red)';
  const i=hoverIdx==null?s.length-1:hoverIdx, cx=X(i), cy=Y(s[i][1]);
  svg.innerHTML=`<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L ${W-P} ${H} L ${P} ${H} Z" fill="url(#ar)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="var(--line)" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${col}"/>`;
  const u=IND[hInd].u, v=s[i][1], ch=u==='%'?v-s[0][1]:(v/s[0][1]-1)*100;
  el('hval').textContent=(u==='%'?'':u)+money(v)+(u==='%'?'%':'');
  el('hchg').innerHTML=`<span class="${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'} ${pc(ch)}${unit(hInd)}</span> en el período`;
  el('hdate').innerHTML=dayfmt(new Date(s[i][0]))+'<br>mín '+money(min)+' · máx '+money(max);
}

// crosshair con dedo o mouse
function touch(ev){
  if(!hData||hData.length<2)return;
  const r=el('chart').getBoundingClientRect();
  const x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width;
  draw(hData,Math.max(0,Math.min(hData.length-1,Math.round(x*(hData.length-1)))));
  if(ev.cancelable)ev.preventDefault();
}
['touchstart','touchmove','mousemove'].forEach(t=>el('chart').addEventListener(t,touch,{passive:false}));
['touchend','mouseleave'].forEach(t=>el('chart').addEventListener(t,()=>draw(hData)));

/* ---------- ajustes ---------- */
function applyCfg(){
  const t=cfg.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro'):cfg.theme;
  document.documentElement.dataset.t=t;
  el('theme').value=cfg.theme;el('dec').value=cfg.dec;el('ncards').value=cfg.ncards;el('editm').value=cfg.edit;
  LS.set('cfg',cfg);cards();rows();
}
el('cfgb').onclick=()=>el('cfg').classList.toggle('open');
['theme','dec','ncards','editm'].forEach(id=>el(id).addEventListener('change',e=>{
  cfg[id==='ncards'?'ncards':id==='editm'?'edit':id]=id==='ncards'||id==='editm'?+e.target.value:e.target.value;
  applyCfg()}));
function reset(){try{localStorage.clear()}catch(e){}location.reload()}

/* ---------- eventos ---------- */
el('amt').value=LS.get('amt','1.000');
el('amt').addEventListener('input',()=>calc(base));
el('amt').addEventListener('focus',e=>e.target.select());
el('base').addEventListener('change',e=>{base=e.target.value;LS.set('base',base);fillPick();rows()});
el('pick').addEventListener('change',e=>{if(!e.target.value)return;sel.push(e.target.value);LS.set('sel',sel);rows();fillPick()});
el('rf').onclick=()=>load(1);

/* ---------- carga ---------- */
function apply(rates,when){R=rates;cards();fillPick();rows();el('st').textContent=when}

async function load(force){
  const c=LS.get('rates',null);
  apply(c&&!force?c.R:R, c?c.t+' · guardado':'valores al '+SNAPDATE);
  el('rf').classList.add('spin');
  try{
    const sig=AbortSignal.timeout?AbortSignal.timeout(8000):undefined;
    const get=u=>fetch(u,{signal:sig}).then(r=>r.json());
    const [fx,ind,ck]=await Promise.all([
      get('https://open.er-api.com/v6/latest/USD'),
      get('https://mindicador.cl/api').catch(()=>null),
      get('https://api.coingecko.com/api/v3/simple/price?ids='+Object.values(CRYPTO).join(',')+'&vs_currencies=clp').catch(()=>({}))
    ]);
    const usd=ind?ind.dolar.valor:fx.rates.CLP;
    const rates={};
    for(const k in fx.rates)rates[k]=usd/fx.rates[k];
    rates.CLP=1;
    if(ind){rates.UF=ind.uf.valor;rates.UTM=ind.utm.valor;rates.USD=usd}
    for(const k in CRYPTO)if(ck[CRYPTO[k]])rates[k]=ck[CRYPTO[k]].clp;
    const t=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    apply(rates,'Actualizado: '+t);
    LS.set('rates',{R:rates,t});
  }catch(e){el('st').textContent+=' · sin red'}
  el('rf').classList.remove('spin');
}

// series de las tarjetas en segundo plano, para mostrar la variación anual de cada una
async function cardSeries(){
  for(const k of cardsSel.slice(0,cfg.ncards)){try{await serie(k,365);cards()}catch(e){}}
}
hchips();applyCfg();load();hist().then(cardSeries);
// refresca al volver a la app
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(1)});
</script>
</body>
</html>
